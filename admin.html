<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản trị lớp 7A5</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

h1 {
    text-align: center;
    color: #1e40af;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

/* INPUT */

label {
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

/* BUTTON */

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.logout {
    background: #dc2626;
    margin-top: 25px;
}

.logout:hover {
    background: #b91c1c;
}

/* LOGIN */

#loginPanel {
    max-width: 430px;
    margin: auto;
}

#message {
    text-align: center;
    margin-top: 15px;
    color: #dc2626;
}

/* ADMIN */

#adminPanel {
    display: none;
}

.user-info {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.admin-section {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 22px;
    margin-top: 20px;
    border-radius: 12px;
}

.admin-section h2 {
    margin-top: 0;
    color: #1e40af;
}

#noticeMessage {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.menu {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 25px;
}

.menu-item {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2563eb;
    text-decoration: none;
}

@media(max-width:600px) {

    .container {
        margin: 15px auto;
    }

    .card {
        padding: 20px;
    }

}

</style>
</head>


<body>

<div class="container">

<div class="card">


<!-- =================================
     ĐĂNG NHẬP
================================== -->

<div id="loginPanel">

<h1>🔐 Quản trị lớp 7A5</h1>

<p class="subtitle">
Dành cho giáo viên chủ nhiệm
</p>


<label>Email</label>

<input
type="email"
id="email"
placeholder="Nhập email quản trị"
>


<label>Mật khẩu</label>

<input
type="password"
id="password"
placeholder="Nhập mật khẩu"
>


<button id="loginButton">
Đăng nhập
</button>


<div id="message"></div>


<a
href="index.html"
class="back-home">
← Về trang lớp 7A5
</a>

</div>



<!-- =================================
     ADMIN PANEL
================================== -->

<div id="adminPanel">


<h1>⚙️ QUẢN TRỊ LỚP 7A5</h1>


<div class="user-info">

Đang đăng nhập:

<strong id="userEmail"></strong>

</div>



<!-- =================================
     ĐĂNG THÔNG BÁO
================================== -->

<div class="admin-section">


<h2>
📢 Đăng thông báo
</h2>


<label>
Tiêu đề
</label>

<input
type="text"
id="noticeTitle"
placeholder="Ví dụ: Họp phụ huynh đầu năm"
>


<label>
Ngày thông báo
</label>

<input
type="date"
id="noticeDate"
>


<label>
Nội dung
</label>

<textarea
id="noticeContent"
placeholder="Nhập nội dung thông báo..."
></textarea>


<button id="addNoticeButton">
📢 Đăng thông báo
</button>


<div id="noticeMessage"></div>


</div>



<!-- =================================
     CÁC CHỨC NĂNG KHÁC
================================== -->

<div class="menu">


<div class="menu-item">
📅
<br><br>
<strong>Lịch tuần</strong>
</div>


<div class="menu-item">
📷
<br><br>
<strong>Hình ảnh</strong>
</div>


<div class="menu-item">
🏆
<br><br>
<strong>Thành tích</strong>
</div>


<div class="menu-item">
📚
<br><br>
<strong>Tài liệu</strong>
</div>


</div>


<a
href="index.html"
class="back-home">
← Xem trang lớp 7A5
</a>


<button
id="logoutButton"
class="logout">
Đăng xuất
</button>


</div>


</div>

</div>



<!-- =================================
     FIREBASE
================================== -->

<script type="module">


/* FIREBASE APP */

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


/* FIREBASE AUTHENTICATION */

import {

getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* FIRESTORE */

import {

getFirestore,
collection,
addDoc,
serverTimestamp

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* =================================
   FIREBASE CONFIG
================================== */


const firebaseConfig = {

apiKey:
"AIzaSyDlGTat3NPbWnvbODzYB9uyQebpxXb_vXM",

authDomain:
"site7a5.firebaseapp.com",

projectId:
"site7a5",

storageBucket:
"site7a5.firebasestorage.app",

messagingSenderId:
"498959350083",

appId:
"1:498959350083:web:af4e7b22bbeecae5c7d7f6",

measurementId:
"G-4JXT13SKHZ"

};



/* =================================
   KHỞI TẠO FIREBASE
================================== */


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* =================================
   CÁC THÀNH PHẦN
================================== */


const loginPanel =
document.getElementById("loginPanel");


const adminPanel =
document.getElementById("adminPanel");


const message =
document.getElementById("message");


const noticeMessage =
document.getElementById("noticeMessage");



/* =================================
   ĐĂNG NHẬP
================================== */


document
.getElementById("loginButton")
.addEventListener("click", async () => {


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


message.textContent = "";


if (!email || !password) {

message.textContent =
"Vui lòng nhập email và mật khẩu.";

return;

}


try {


await signInWithEmailAndPassword(
auth,
email,
password
);


}


catch(error) {


console.error(error);


message.textContent =
"Email hoặc mật khẩu không đúng.";


}


});



/* ENTER ĐỂ ĐĂNG NHẬP */

document
.getElementById("password")
.addEventListener("keydown", function(event) {

if (event.key === "Enter") {

document
.getElementById("loginButton")
.click();

}

});



/* =================================
   ĐĂNG XUẤT
================================== */


document
.getElementById("logoutButton")
.addEventListener("click", async () => {


await signOut(auth);


});



/* =================================
   KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP
================================== */


onAuthStateChanged(auth, (user) => {


if (user) {


loginPanel.style.display =
"none";


adminPanel.style.display =
"block";


document
.getElementById("userEmail")
.textContent =
user.email;


}


else {


loginPanel.style.display =
"block";


adminPanel.style.display =
"none";


document
.getElementById("password")
.value =
"";


}


});



/* =================================
   ĐĂNG THÔNG BÁO
================================== */


document
.getElementById("addNoticeButton")
.addEventListener("click", async () => {


const user =
auth.currentUser;


/* CHƯA ĐĂNG NHẬP */

if (!user) {


noticeMessage.style.color =
"#dc2626";


noticeMessage.textContent =
"Bạn cần đăng nhập.";


return;


}



/* LẤY DỮ LIỆU */

const title =
document
.getElementById("noticeTitle")
.value
.trim();


const date =
document
.getElementById("noticeDate")
.value;


const content =
document
.getElementById("noticeContent")
.value
.trim();



/* KIỂM TRA */

if (!title || !date || !content) {


noticeMessage.style.color =
"#dc2626";


noticeMessage.textContent =
"Vui lòng nhập đầy đủ tiêu đề, ngày và nội dung.";


return;


}



/* GHI FIRESTORE */

try {


noticeMessage.style.color =
"#2563eb";


noticeMessage.textContent =
"Đang đăng thông báo...";


await addDoc(

collection(db, "notices"),

{

title: title,

date: date,

content: content,

createdAt:
serverTimestamp()

}

);



/* THÀNH CÔNG */

noticeMessage.style.color =
"#16a34a";


noticeMessage.textContent =
"✓ Đã đăng thông báo thành công!";



/* XÓA FORM */

document
.getElementById("noticeTitle")
.value =
"";


document
.getElementById("noticeDate")
.value =
"";


document
.getElementById("noticeContent")
.value =
"";


}


catch(error) {


console.error(error);


noticeMessage.style.color =
"#dc2626";


noticeMessage.textContent =
"Không đăng được thông báo. Vui lòng kiểm tra Firestore Rules.";


}


});


</script>


</body>

</html>
